[project]
name = "rb-wordstat"
# Version comes from the git tag vX.Y.Z (uv-dynamic-versioning) — never add `version =`.
dynamic = ["version"]
description = "Частоты Яндекс.Wordstat через провайдеров (XML River, XMLStock) с фолбэком: CLI wordstat и библиотека rb_wordstat"
readme = "README.md"
authors = [{ name = "bolandeu" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "packaging>=24.0",
    "keyring>=25.0",
]

[project.scripts]
wordstat = "rb_wordstat.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/wordstat"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
# Rebuild the editable install when a commit or tag moves, so `--version` follows the tag.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/rb_wordstat"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "towncrier>=24.8",
    "ty>=0.0.80",
]

# Changelog from fragments: each change adds changelog.d/+<slug>.<type>.md
# (`uv run towncrier create +<slug>.<type>.md -c "..."`); scripts/release.py assembles them.
[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.cli-generator]
# Where scripts/check_command_docstrings.py (git pre-commit + Claude Code hooks)
# looks for commands: a glob or a list of globs, relative to the repo root.
commands = ["src/rb_wordstat/commands/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing:skip-covered"
# tests/test_help.py keeps help snapshots at tests/snapshots/help/<command>.txt
# (standard §7), not in syrupy's own `__snapshots__/<test file>/` layout, so
# syrupy warns it "can not relate" each file to its test. It can — by name.
filterwarnings = ["ignore:(?s).*Can not relate snapshot:UserWarning"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# The template ships at ~94%; keep the bar where it is instead of letting
# new commands land untested. Raise it, never lower it.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Тексты и комментарии на русском: кириллица — не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                # assert is the point of a test
"scripts/*" = ["S603", "S607"]      # subprocess with fixed argv lists (git, uv), no shell

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` style is a call in a default on purpose.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
