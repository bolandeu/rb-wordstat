[project]
name = "rb-wordstat"
version = "0.1.0"
description = "Яндекс.Wordstat парсер: библиотека, CLI и MCP-сервер"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.26.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
rb-wordstat = "rb_wordstat.cli:main"

[project.entry-points."mcp.servers"]
rb-wordstat = "rb_wordstat.mcp_server:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rb_wordstat"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
