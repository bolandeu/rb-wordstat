schema = 1
mode = "fast"
prefix = "WORDSTAT"
name = "wordstat"
checks = ["python3 scripts/check_command_docstrings.py"]
heavy = ["rb-release check"]

# the workserver, 48 cores (the Human 28.10: at least four tasks at once); heavy checks queue on the machine
parallel = 4

[review]
required_types = ["feature", "bugfix"]  # chore and docs: the short path without review

[publish]
versioning = "semver"
changelog = "CHANGELOG.md"
deploy_command = "sh scripts/deploy.sh"
gate = "local"
gate_command = 'uvx --from "git+https://homeserver.tailee01ab.ts.net:3000/bolandeu/cli-generator.git@v1.27.3#subdirectory=gate" rb-release check'
env = { UV_PYTHON = "3.14" }

[connector]
webhook_secret = "PLANE_WEBHOOK_SECRET_TOOLS"
kind = "plane"
base_url = "https://homeserver.tailee01ab.ts.net:8443"
workspace = "tools"
project_id = "35ee3879-c102-4b77-b194-f30ea04f5afc"
humans = ["r.bolandau@gmail.com"]

[connector.states]
ideas = "Backlog"
queue = "Todo"
in_progress = "In Progress"
in_review = "In Review"
publish = "Publishing"
done = "Done"
cancelled = "Cancelled"

[daemon]
enabled = true
